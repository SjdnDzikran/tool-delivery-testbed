# Historical configuration example; not an authorization or deployment recipe.
# 6 tiny tasks x 2 models x 3 modes x 2 catalogs = 72 first attempts.
schema_version = 1
[harness]
campaign_id = "harbor-engineering-pilot"
binary = "~/.local/bin/pi-research"
required_version = "1.0.4"
auth_source = "~/.config/tool-delivery-testbed/auth.json"
auth_mode = "copy"
harbor_pilot_image = "pi-harbor-pilot:engineering-v1"
harbor_image_id = "sha256:88559617e80fe5b5d10453e4792d85e84986ace47c82ccec9fdbbeb59cd76102"
[paths]
skills_dir = "../skills"
[models.gpt6luna]
provider = "openai"
id = "gpt-6-luna"
thinking = "max"
[models.glm53flash]
provider = "zai"
id = "glm-5.3-flash"
thinking = "max"
[catalog.brave-search]
command = "brave-search-mcp-server"
args = []
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }
env_names = ["BRAVE_API_KEY"]
description = "Web, news, image, and video search via the Brave Search API."
[catalog.playwright]
command = "playwright-mcp"
args = ["--browser", "chrome", "--headless", "--isolated", "--sandbox"]
env = { PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/opt/google/chrome/chrome" }
description = "Sandboxed pinned Google Chrome browser automation."
[catalog.postgres]
command = "postgres-mcp"
args = ["--access-mode=unrestricted"]
env = { DATABASE_URI = "postgresql://study@127.0.0.1:5432/study" }
description = "Read and write access to the disposable trial PostgreSQL database."
[catalog.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${STUDY_GITHUB_TOKEN}" }
env_names = ["STUDY_GITHUB_TOKEN"]
description = "GitHub repositories, pull requests, issues, and commits on the dedicated study account."
[capabilities.bx]
kind = "cli"
skills = ["bx-search"]
executables = ["bx"]
[capabilities.playwright-cli]
kind = "cli"
skills = ["playwright-cli"]
executables = ["playwright-cli"]
[capabilities.psql]
kind = "cli"
skills = ["psql"]
executables = ["psql"]
[capabilities.gh]
kind = "cli"
skills = ["gh"]
executables = ["gh-github", "git"]
[tasks.control_1]
instruction = "../../controls/control_1_filter_sort/instruction.md"
capabilities = []
catalog = []
deadline_s = 600
[tasks.control_2]
instruction = "../../controls/control_2_group_aggregate/instruction.md"
capabilities = []
catalog = []
deadline_s = 600
[tasks.cap_brave]
instruction = "capability-smoke/instructions/cap_brave.md"
capabilities = ["bx"]
catalog = ["brave-search"]
deadline_s = 600
[tasks.cap_browser]
instruction = "capability-smoke/instructions/cap_browser.md"
capabilities = ["playwright-cli"]
catalog = ["playwright"]
deadline_s = 600
[tasks.cap_db]
instruction = "capability-smoke/instructions/cap_db.md"
capabilities = ["psql"]
catalog = ["postgres"]
deadline_s = 600
[tasks.cap_gh]
instruction = "harbor-pilot/cap_gh.md"
capabilities = ["gh"]
catalog = ["github"]
deadline_s = 600
[matrix]
modes = ["eager", "deferred", "cli"]
models = ["gpt6luna", "glm53flash"]
catalogs = ["required", "full"]
reps = 1
seed = 2026
[quota]
base_s = 60
multiplier = 2
cap_s = 1800
pause_above_s = 600
max_attempts_per_trial = 1
[budget]
max_total_tokens = 250000
