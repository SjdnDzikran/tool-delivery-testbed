# Original browser tasks on a disclosed candidate deployment, not original-image identity.
schema_version = 1
[harness]
campaign_id = "real-browser-glm-2026-10-31-v1"
binary = "~/.local/bin/pi-research"
required_version = "1.0.4"
auth_source = "~/.config/tool-delivery-testbed/auth.json"
auth_mode = "copy"
harbor_pilot_image = "pi-harbor-pilot:corrected-v2"
harbor_image_id = "sha256:d157e18511f9800c0238647b2ecf4cc6252c79f95e26f69c439c1f39f8401529"
harbor_actual_tasks = true
harbor_actual_verifier_image = "pi-real-verifier:2026-10-31-v2"
harbor_actual_verifier_image_id = "sha256:03d8f3d01350ff704df7c43c1fda22d8ef301623cff65f687dd75770cb274469"
harbor_route_contract = "declared-route-v2"
harbor_trace_cli = true
[paths]
skills_dir = "../skills"
[models.glm53flash]
provider = "zai"
id = "glm-5.3-flash"
thinking = "max"
[catalog.brave-search]
command = "brave-search-mcp-server"
args = []
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }
env_names = ["BRAVE_API_KEY"]
description = "Web, news, image, and video search via the Brave Search API."
[catalog.playwright]
command = "playwright-mcp"
args = ["--browser", "chrome", "--headless", "--isolated", "--sandbox"]
env = { PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/opt/google/chrome/chrome" }
description = "Sandboxed pinned Google Chrome browser automation."
[catalog.postgres]
command = "postgres-mcp"
args = ["--access-mode=unrestricted"]
env = { DATABASE_URI = "postgresql://study@127.0.0.1:5432/study" }
description = "Read and write access to the disposable trial PostgreSQL database."
[catalog.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${STUDY_GITHUB_TOKEN}" }
env_names = ["STUDY_GITHUB_TOKEN"]
description = "GitHub repositories, pull requests, issues, and commits on the dedicated study account."
[capabilities.bx]
kind = "cli"
skills = ["bx-search"]
executables = ["bx"]
[capabilities.playwright-cli]
kind = "cli"
skills = ["playwright-cli"]
executables = ["playwright-cli"]
[capabilities.psql]
kind = "cli"
skills = ["psql"]
executables = ["psql"]
[capabilities.gh]
kind = "cli"
skills = ["gh"]
executables = ["gh-github", "git"]
[tasks.products_sales_analysis]
instruction = "../runtime/real-task-preparation/task-inputs-v1/products_sales_analysis/input/instruction.md"
capabilities = ["playwright-cli"]
catalog = ["playwright"]
deadline_s = 2400
assets = { verifier = "../runtime/real-task-preparation/task-inputs-v1/products_sales_analysis/verifier/verify.py", label = "../runtime/real-task-preparation/mcpmark/tasks/playwright_webarena/standard/shopping_admin/products_sales_analysis/label.txt", oracle = "../harbor_pi/shopping_ui_ops.py" }
[tasks.customer_segmentation_setup]
