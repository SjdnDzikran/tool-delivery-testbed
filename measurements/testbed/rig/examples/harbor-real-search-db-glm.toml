# Real-task admission phase: two GAIA selections and two original MCPMark SQL tasks.
# GLM/max only; required catalog; one primary attempt per configuration.
schema_version = 1
[harness]
campaign_id = "real-search-db-glm-2026-10-31-v1"
binary = "~/.local/bin/pi-research"
required_version = "1.0.4"
auth_source = "~/.config/tool-delivery-testbed/auth.json"
auth_mode = "copy"
harbor_pilot_image = "pi-harbor-pilot:corrected-v2"
harbor_image_id = "sha256:d157e18511f9800c0238647b2ecf4cc6252c79f95e26f69c439c1f39f8401529"
harbor_actual_tasks = true
harbor_actual_verifier_image = "pi-real-verifier:2026-10-31-v1"
harbor_actual_verifier_image_id = "sha256:9105157e9896e5715055e6480877d365e399de1f95b7950acfa9c03ecfc83ae0"
gaia_verification_receipt = "../../../gaia-primary-bound-verification-2026-10-31.json"
harbor_route_contract = "declared-route-v1"
harbor_trace_cli = true
[paths]
skills_dir = "../skills"
[models.glm53flash]
provider = "zai"
id = "glm-5.3-flash"
thinking = "max"
[catalog.brave-search]
command = "brave-search-mcp-server"
args = []
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }
env_names = ["BRAVE_API_KEY"]
description = "Web, news, image, and video search via the Brave Search API."
[catalog.playwright]
command = "playwright-mcp"
args = ["--browser", "chrome", "--headless", "--isolated", "--sandbox"]
env = { PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/opt/google/chrome/chrome" }
description = "Sandboxed pinned Google Chrome browser automation."
[catalog.postgres]
command = "postgres-mcp"
args = ["--access-mode=unrestricted"]
env = { DATABASE_URI = "postgresql://study@127.0.0.1:5432/study" }
description = "Read and write access to the disposable trial PostgreSQL database."
[catalog.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${STUDY_GITHUB_TOKEN}" }
env_names = ["STUDY_GITHUB_TOKEN"]
description = "GitHub repositories, pull requests, issues, and commits on the dedicated study account."
[capabilities.bx]
kind = "cli"
skills = ["bx-search"]
executables = ["bx"]
[capabilities.playwright-cli]
kind = "cli"
skills = ["playwright-cli"]
executables = ["playwright-cli"]
[capabilities.psql]
kind = "cli"
skills = ["psql"]
executables = ["psql"]
[capabilities.gh]
kind = "cli"
skills = ["gh"]
executables = ["gh-github", "git"]
[tasks.employee_demographics_report]
instruction = "../runtime/real-task-preparation/task-inputs-v1/employee_demographics_report/input/instruction.md"
capabilities = ["psql"]
catalog = ["postgres"]
deadline_s = 1800
assets = { fixture = "../runtime/real-task-preparation/postgres-fixtures/employees.sql.gz", verifier = "../runtime/real-task-preparation/task-inputs-v1/employee_demographics_report/verifier/verify.py", oracle = "../harbor_pi/actual_oracles/demographics.sql" }
[tasks.employee_hierarchy_management]
instruction = "../runtime/real-task-preparation/task-inputs-v1/employee_hierarchy_management/input/instruction.md"
capabilities = ["psql"]
catalog = ["postgres"]
deadline_s = 1800
assets = { fixture = "../runtime/real-task-preparation/postgres-fixtures/chinook.sql", verifier = "../runtime/real-task-preparation/task-inputs-v1/employee_hierarchy_management/verifier/verify.py", oracle = "../harbor_pi/actual_oracles/hierarchy.sql" }
[tasks.gaia_1]
instruction = "../runtime/real-task-preparation/task-inputs-v1/gaia_task-a/input/instruction.md"
capabilities = ["bx"]
catalog = ["brave-search"]
deadline_s = 1200
assets = { reference = "../../gaia/gaia_tasks/task-a.json", verifier = "../../gaia/verify_gaia.py", oracle = "../runtime/real-task-preparation/gaia-oracle-1.json", common_verifier = "../../common/verify_lib.py" }
[tasks.gaia_2]
instruction = "../runtime/real-task-preparation/task-inputs-v1/gaia_task-b/input/instruction.md"
capabilities = ["bx"]
catalog = ["brave-search"]
deadline_s = 1200
assets = { reference = "../../gaia/gaia_tasks/task-b.json", verifier = "../../gaia/verify_gaia.py", oracle = "../runtime/real-task-preparation/gaia-oracle-2.json", common_verifier = "../../common/verify_lib.py" }
[matrix]
modes = ["eager", "deferred", "cli"]
models = ["glm53flash"]
catalogs = ["required"]
reps = 1
seed = 2026
[quota]
max_attempts_per_trial = 1
[budget]
max_total_tokens = 2000000
