# Historical validation manifest example; inspect before adapting.
# Four challenges x required/full; unchanged skills; GPT-6 Luna max; CLI only.
schema_version = 1
[harness]
campaign_id = "harbor-skill-challenges-gpt6luna"
binary = "~/.local/bin/pi-research"
required_version = "1.0.4"
auth_source = "~/.config/tool-delivery-testbed/auth.json"
auth_mode = "copy"
harbor_pilot_image = "pi-harbor-pilot:corrected-v2"
harbor_image_id = "sha256:d157e18511f9800c0238647b2ecf4cc6252c79f95e26f69c439c1f39f8401529"
harbor_route_contract = "declared-route-v1"
harbor_trace_cli = true
harbor_skill_challenges = true
[paths]
skills_dir = "../skills"
[models.gpt6luna]
provider = "openai"
id = "gpt-6-luna"
thinking = "max"
[catalog.brave-search]
command = "brave-search-mcp-server"
args = []
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }
env_names = ["BRAVE_API_KEY"]
description = "Web, news, image, and video search via the Brave Search API."
[catalog.playwright]
command = "playwright-mcp"
args = ["--browser", "chrome", "--headless", "--isolated", "--sandbox"]
env = { PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/opt/google/chrome/chrome" }
description = "Sandboxed pinned Google Chrome browser automation."
[catalog.postgres]
command = "postgres-mcp"
args = ["--access-mode=unrestricted"]
env = { DATABASE_URI = "postgresql://study@127.0.0.1:5432/study" }
description = "Read and write access to the disposable trial PostgreSQL database."
[catalog.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${STUDY_GITHUB_TOKEN}" }
env_names = ["STUDY_GITHUB_TOKEN"]
description = "GitHub repositories, pull requests, issues, and commits on the dedicated study account."
[capabilities.bx]
kind = "cli"
skills = ["bx-search"]
executables = ["bx"]
[capabilities.playwright-cli]
kind = "cli"
skills = ["playwright-cli"]
executables = ["playwright-cli"]
[capabilities.psql]
kind = "cli"
skills = ["psql"]
executables = ["psql"]
[capabilities.gh]
kind = "cli"
skills = ["gh"]
executables = ["gh-github", "git"]
[tasks.cap_brave]
instruction = "skill-challenges/cap_brave.md"
capabilities = ["bx"]
catalog = ["brave-search"]
deadline_s = 600
[tasks.cap_browser]
instruction = "skill-challenges/cap_browser.md"
capabilities = ["playwright-cli"]
catalog = ["playwright"]
deadline_s = 600
[tasks.cap_db]
instruction = "skill-challenges/cap_db.md"
capabilities = ["psql"]
catalog = ["postgres"]
deadline_s = 600
[tasks.cap_gh]
instruction = "skill-challenges/cap_gh.md"
capabilities = ["gh"]
catalog = ["github"]
deadline_s = 600
[matrix]
modes = ["cli"]
models = ["gpt6luna"]
catalogs = ["required", "full"]
reps = 1
seed = 2026
[quota]
base_s = 60
multiplier = 2
cap_s = 1800
pause_above_s = 600
max_attempts_per_trial = 1
[budget]
max_total_tokens = 250000
