reps = 3
seed = 2026
[quota]
max_attempts_per_trial = 1
[budget]
# Per-cell assistant-event watchdog safety thresholds; not strict billed-spend caps.
max_total_tokens = 3000000
browser_eager_max_tokens = 6000000
# Sum of 24 browser-eager and 408 other cell ceilings, not expected usage
# or spending authorization. Aggregate recorded-usage gate runs between cells.
aggregate_max_total_tokens = 1368000000
[cost_policy]
metric = "api_equivalent_cost"
currency = "USD"
